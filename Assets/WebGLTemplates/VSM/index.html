<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#12161d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Тренажёр проводника ВСМ</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="TemplateData/style.css">
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="overlay" class="overlay">
        <img class="logo" src="TemplateData/logo-mt.png" alt="Московский Транспорт">
        <div class="title">Тренажёр проводника ВСМ</div>
        <div class="rule"></div>
        <div class="subtitle">Сценарии работы с пассажирами в поезде</div>
        <div id="progress"><div id="progress-fill"></div></div>
        <div id="progress-label">Загрузка…</div>
        <button id="start-button" type="button">Начать</button>
        <div id="start-hint">Игра откроется во весь экран. Выйти из полноэкранного режима: Esc.</div>
        <div id="error"></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var overlay = document.querySelector("#overlay");
      var progressFill = document.querySelector("#progress-fill");
      var progressLabel = document.querySelector("#progress-label");
      var startButton = document.querySelector("#start-button");
      var errorBox = document.querySelector("#error");
      var warningBanner = document.querySelector("#unity-warning");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      // Browsers only allow fullscreen from a user gesture, so this is called from click/tap handlers only.
      function enterFullscreen() {
        if (isFullscreen()) return;
        var root = document.documentElement;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!request) return; // iPhone Safari has no Fullscreen API.
        var result = request.call(root, { navigationUI: "hide" });
        if (result && result.then) {
          result.then(lockLandscape).catch(function () {});
        }
      }

      function lockLandscape() {
        if (isMobile && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(function () {});
        }
      }

      function showError(message) {
        errorBox.textContent = message;
        overlay.classList.add("failed");
      }

      function unityShowBanner(msg, type) {
        if (type == "error") {
          showError(msg);
          return;
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        warningBanner.style.display = "block";
        setTimeout(function () {
          warningBanner.removeChild(div);
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }, 5000);
      }

      startButton.addEventListener("click", function () {
        enterFullscreen();
        overlay.classList.add("hidden");
        canvas.focus();
      });

      // After Esc the next click or tap on the game returns it to fullscreen.
      // Mouse gets fullscreen on press, touch only on release: that is when browsers count it as a user gesture.
      canvas.addEventListener("pointerdown", function (e) {
        if (e.pointerType == "mouse") enterFullscreen();
      });
      canvas.addEventListener("pointerup", function (e) {
        if (e.pointerType != "mouse") enterFullscreen();
      });

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // Phone screens have a pixel ratio of 2-4; rendering at full density costs a lot of GPU for little visible gain.
      if (isMobile) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percent = Math.round(100 * progress);
          progressFill.style.width = percent + "%";
          progressLabel.textContent = "Загрузка… " + percent + "%";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          overlay.classList.add("ready");
          startButton.focus();
        }).catch(function (message) {
          showError("Не удалось запустить тренажёр: " + message);
        });
      };
      script.onerror = function () {
        showError("Не удалось загрузить файлы игры. Проверьте подключение и обновите страницу.");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
